<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DO Membership Admin</title>
<style>
body{margin:auto;background:#0b0b0b;color:#f4f4f4;font:14px/1.5 system-ui,sans-serif;padding:16px;max-width:900px}
h1{font-size:16px;letter-spacing:.14em}h2{font-size:13px;letter-spacing:.14em;margin-top:32px;opacity:.7}
input,button{font:inherit;padding:10px;border:1px solid #333;background:#151515;color:#fff}
button{cursor:pointer}.ok{background:#1f6b3a}.no{background:#7a2323}
.card{border:1px solid #2a2a2a;padding:12px;margin:10px 0;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.dim{opacity:.6;font-size:12px}.pill{font-size:11px;padding:2px 8px;border:1px solid #444}
</style></head><body>
<h1>DO — MEMBERSHIP ADMIN</h1>
<div id="login"><input id="key" type="password" placeholder="Admin key"> <button id="go">ENTER</button></div>
<div id="app" hidden>
  <h2>PAYMENTS</h2><div id="pay"></div>
  <h2>MEMBERS</h2><div id="mem"></div>
  <h2>BIDS</h2><div id="bids"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let KEY = sessionStorage.getItem("dokey") || "";
const call = async (path, body) => {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Error");
  return r.json();
};
const when = (ms) => new Date(ms).toLocaleString("en-IN");
const row = (...k) => { const d = document.createElement("div"); d.className = "card"; d.append(...k); return d; };
const txt = (t, c) => { const s = document.createElement("div"); s.textContent = t; if (c) s.className = c; return s; };
async function load() {
  try {
    const [p, m, bd] = await Promise.all([call("/api/m/admin/payments"), call("/api/m/admin/members"), call("/api/m/admin/bids")]);
    sessionStorage.setItem("dokey", KEY);
    $("login").hidden = true; $("app").hidden = false;
    $("pay").replaceChildren(...p.payments.map((x) => {
      const info = document.createElement("div");
      info.append(txt(`${x.name} · ${x.do_id} · ₹${x.amount} (${x.plan})`), txt(`UTR: ${x.utr}`), txt(`${x.email} ${x.phone || ""} · ${when(x.created_at)}`, "dim"));
      const act = document.createElement("div");
      if (x.status === "pending") {
        for (const [label, a, c] of [["APPROVE", "approve", "ok"], ["REJECT", "reject", "no"]]) {
          const b = document.createElement("button"); b.textContent = label; b.className = c;
          b.onclick = async () => { b.disabled = true; try { await call("/api/m/admin/decide", { id: x.id, action: a }); load(); } catch (e) { alert(e.message); b.disabled = false; } };
          act.append(b, " ");
        }
      } else act.append(txt(x.status.toUpperCase(), "pill"));
      return row(info, act);
    }));
    $("mem").replaceChildren(...m.members.map((u) => row(txt(`${u.name} · ${u.do_id} · ${u.email}`), txt(u.member_until > Date.now() ? `Active till ${when(u.member_until)}` : "Not active", "dim"))));
    $("bids").replaceChildren(...bd.bids.map((x) => row(txt(`₹${x.amount} · ${x.item}`), txt(`${x.name} · ${x.do_id} · ${x.email} ${x.phone || ""} · ${when(x.created_at)}`, "dim"))));
  } catch (e) { sessionStorage.removeItem("dokey"); $("login").hidden = false; $("app").hidden = true; if (KEY) alert("Wrong admin key"); }
}
$("go").onclick = () => { KEY = $("key").value; load(); };
if (KEY) load();
</script></body></html>
