<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>DO — Tasks</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--line:#272727;--fg:#f2f0eb;--muted:#96938d;--accent:#d7ff3a;--danger:#ff6258}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1b2010,transparent 38%),var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}button,input{font:inherit}button{color:inherit}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:42px 0}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand a{color:var(--fg);text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.18em}.brand span,.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.eyebrow{color:var(--accent)}
    h1{font-size:clamp(48px,10vw,84px);line-height:.9;letter-spacing:-.06em;margin:12px 0 16px}.intro{color:var(--muted);margin-bottom:28px}.app{border:1px solid var(--line);border-radius:18px;background:rgba(16,16,16,.96);overflow:hidden}.add{display:flex;gap:10px;padding:18px;border-bottom:1px solid var(--line)}.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:#080808;color:var(--fg);padding:13px 15px}.primary{border:0;border-radius:9px;background:var(--accent);color:#050505;padding:0 18px;font-weight:800;cursor:pointer}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:5px}.filter,.clear{border:0;border-radius:8px;background:transparent;padding:7px 10px;color:var(--muted);cursor:pointer}.filter[aria-pressed="true"]{background:#252a16;color:var(--accent)}.count{color:var(--muted);font-size:12px}.tasks{list-style:none;margin:0;padding:8px 18px}.task{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 2px;border-bottom:1px solid #222}.task:last-child{border-bottom:0}.check{appearance:none;flex:none;width:21px;height:21px;border:1px solid #656565;border-radius:50%;display:grid;place-items:center;margin:0;cursor:pointer}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked::after{content:"✓";color:#080808;font-size:13px;font-weight:900}.text{flex:1;overflow-wrap:anywhere}.done .text{text-decoration:line-through;color:#777}.actions{display:flex;gap:3px}.actions button{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:7px;cursor:pointer}.actions button:hover{background:#242424;color:var(--fg)}.actions .delete:hover{color:var(--danger)}.edit{flex:1;min-width:0;border:1px solid var(--accent);border-radius:7px;background:#080808;color:var(--fg);padding:7px 9px}.empty{padding:42px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--fg);margin-bottom:5px}.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:15px 18px;color:var(--muted);font-size:12px}.saved{color:var(--accent)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);border-radius:8px;background:var(--accent);color:#080808;padding:10px 16px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:520px){.wrap{padding-top:28px}.brand{margin-bottom:38px}.add{padding:12px}.primary{padding:0 12px}.toolbar{align-items:flex-start;flex-direction:column}.tasks{padding-inline:13px}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><a href="index.html">DO — DESI OFFICIALS</a><span>Personal task list</span></header>
    <p class="eyebrow">Make it happen</p><h1>YOUR<br>TASKS.</h1><p class="intro">A little progress every day adds up.</p>
    <section class="app" aria-label="To-do list">
      <form class="add" id="addForm"><label for="taskInput" hidden>New task</label><input id="taskInput" maxlength="240" placeholder="What needs to get done?" autocomplete="off" required><button class="primary" type="submit">Add task ＋</button></form>
      <div class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button class="filter" data-filter="all" aria-pressed="true" type="button">All</button><button class="filter" data-filter="active" aria-pressed="false" type="button">Active</button><button class="filter" data-filter="completed" aria-pressed="false" type="button">Completed</button></div><span class="count" id="count" aria-live="polite"></span></div>
      <ul class="tasks" id="tasks"></ul><div class="empty" id="empty" hidden><strong>Nothing on the list yet.</strong>Add a task above to get started.</div>
      <div class="footer"><span><span class="saved">●</span> Saved in this browser</span><button class="clear" id="clearCompleted" type="button">Clear completed</button></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const KEY="do-tasks-v1",form=document.querySelector("#addForm"),input=document.querySelector("#taskInput"),list=document.querySelector("#tasks"),empty=document.querySelector("#empty"),count=document.querySelector("#count"),toast=document.querySelector("#toast");let filter="all",tasks=load();
      function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(value)?value.filter(t=>t&&typeof t.id===typeof ""&&typeof t.text===typeof ""&&typeof t.completed==="boolean"):[]}catch{return[]}}
      function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch{notify("Could not save. Browser storage may be unavailable.");return false}}
      function notify(message){toast.textContent=message;toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove("show"),2600)}
      function button(label,className,handler){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=className;b.setAttribute("aria-label",label);b.addEventListener("click",handler);return b}
      function edit(task,row){const editor=document.createElement("input");editor.className="edit";editor.value=task.text;editor.maxLength=240;const actions=document.createElement("div");actions.className="actions";const finish=commit=>{if(commit){const value=editor.value.trim();if(!value){notify("A task cannot be empty.");editor.focus();return}task.text=value;save()}render()};actions.append(button("Save","save",()=>finish(true)),button("Cancel","cancel",()=>finish(false)));row.replaceChildren(row.querySelector(".check"),editor,actions);editor.focus();editor.select();editor.addEventListener("keydown",e=>{if(e.key==="Enter")finish(true);if(e.key==="Escape")finish(false)})}
      function remove(id){tasks=tasks.filter(t=>t.id!==id);save();render()}
      function render(){list.replaceChildren();const shown=tasks.filter(t=>filter=== "all"||(filter=== "active"&&!t.completed)||(filter=== "completed"&&t.completed));empty.hidden=shown.length>0;list.hidden=shown.length===0;shown.forEach(task=>{const row=document.createElement("li");row.className="task"+(task.completed?" done":"");const check=document.createElement("input");check.type="checkbox";check.className="check";check.checked=task.completed;check.setAttribute("aria-label",(task.completed?"Mark active: ":"Mark complete: ")+task.text);check.addEventListener("change",()=>{task.completed=check.checked;save();render()});const text=document.createElement("span");text.className="text";text.textContent=task.text;const actions=document.createElement("div");actions.className="actions";actions.append(button("Edit","edit",()=>edit(task,row)),button("Delete","delete",()=>remove(task.id)));row.append(check,text,actions);list.append(row)});const left=tasks.filter(t=>!t.completed).length;count.textContent=`${left} ${left===1?"task":"tasks"} left`;document.querySelectorAll(".filter").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.filter===filter)));document.querySelector("#clearCompleted").disabled=!tasks.some(t=>t.completed)}
      form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.unshift({id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`,text,completed:false,createdAt:Date.now()});save();input.value="";filter="all";render();input.focus()});
      document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;render()}));document.querySelector("#clearCompleted").addEventListener("click",()=>{const before=tasks.length;tasks=tasks.filter(t=>!t.completed);if(before!==tasks.length){save();render();notify("Completed tasks cleared.")}});window.addEventListener("storage",e=>{if(e.key===KEY||e.key===null){tasks=load();render()}});render();
    })();
  </script>
</body>
</html>
