<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>My To-Do List</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f5f5f5;
      --muted: #aaa;
      --line: #333;
      --accent: #d7ff3a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px;
      background: radial-gradient(ellipse at top, #25291c, #111 55%);
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #181818;
      box-shadow: 0 20px 70px #0006;
    }

    h1 { margin: 0 0 6px; font-size: clamp(2rem, 7vw, 3rem); }
    .subtitle, .count { color: var(--muted); }

    form {
      display: flex;
      gap: 10px;
      margin: 24px 0 18px;
    }

    input, button { font: inherit; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #101010;
      color: inherit;
    }

    input[type="text"]:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    button {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #222;
      color: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    .add-button { border-color: var(--accent); background: var(--accent); color: #111; font-weight: 700; }
    .add-button:hover { background: #e5ff83; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .filters { display: flex; gap: 6px; }
    .filters button { padding: 7px 10px; font-size: .9rem; }
    .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

    #task-list {
      display: grid;
      gap: 9px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #202020;
    }

    .task input { width: 18px; height: 18px; accent-color: var(--accent); }
    .task-text { flex: 1; overflow-wrap: anywhere; }
    .task.done .task-text { color: var(--muted); text-decoration: line-through; }
    .delete-button { padding: 6px 10px; color: #ff8c83; }
    .empty { padding: 28px 8px; color: var(--muted); text-align: center; }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .clear-button { padding: 0; border: 0; background: none; color: var(--muted); }
    .clear-button:hover { color: #ff8c83; }

    @media (max-width: 460px) {
      main { padding: 20px; }
      form { flex-direction: column; }
      .add-button { width: 100%; }
    }

    @media (prefers-reduced-motion: no-preference) {
      button { transition: border-color .15s, background-color .15s; }
    }
  </style>
</head>
<body>
  <main>
    <h1>My To-Do List</h1>
    <p class="subtitle">Your tasks are saved on this device.</p>

    <form id="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input
        id="task-input"
        type="text"
        maxlength="200"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      >
      <button class="add-button" type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <span class="count" id="task-count" aria-live="polite"></span>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Done</button>
      </div>
    </div>

    <ul id="task-list" aria-label="Tasks"></ul>

    <div class="footer">
      <span class="count">Stored in this browser</span>
      <button class="clear-button" id="clear-completed" type="button">
        Clear completed
      </button>
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "todo-list-tasks-v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const clearButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];

      let filter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(saved)) return [];
          return saved.filter(task =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          );
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          alert("Your browser couldn't save the tasks. Check available storage space or privacy settings.");
        }
      }

      function makeId() {
        return globalThis.crypto?.randomUUID?.()
          || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function render() {
        list.replaceChildren();

        const visibleTasks = tasks.filter(task => {
          if (filter === "active") return !task.completed;
          if (filter === "completed") return task.completed;
          return true;
        });

        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = tasks.length === 0
            ? "No tasks yet. Add one above to get started."
            : "No tasks match this filter.";
          list.append(empty);
        }

        for (const task of visibleTasks) {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " done" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `Mark "${task.text}" as ${task.completed ? "active" : "completed"}`);
          checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", `Delete "${task.text}"`);
          remove.addEventListener("click", () => {
            tasks = tasks.filter(entry => entry.id !== task.id);
            saveTasks();
            render();
          });

          item.append(checkbox, text, remove);
          list.append(item);
        }

        const activeCount = tasks.filter(task => !task.completed).length;
        count.textContent = `${activeCount} active ${activeCount === 1 ? "task" : "tasks"}`;

        for (const button of filterButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        }

        clearButton.disabled = !tasks.some(task => task.completed);
      }

      form.addEventListener("submit", event => {
        event.preventEvent();
        const text = input.value.trim();
        if (!text) return;

        tasks.unshift({ id: makeId(), text, completed: false });
        saveTasks();
        input.value = "";
        render();
        input.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      window.addEventListener("storage", event => {
        if (event.key === STORAGE_KEY) {
          tasks = loadTasks();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
